<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OCSP - Create Account</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="/Styles/register.css">
</head>

<body>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Register Card -->
        <section class="register-card">

            <!-- Register Header -->
            <div class="register-header">

                <h1>Create Your Account</h1>

                <p>
                    Join the Oman Community Services Platform
                    to access civic services.
                </p>

            </div>

            <!-- Registration Form -->
            <form id="registerForm" action="#" method="post">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text" id="name" name="name" placeholder="e.g. Ahmed Al Harthi" maxlength="50" required>

                </div>

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="ahmed@example.com" maxlength="150"
                        required>

                </div>

                <!-- Phone Number -->
                <div class="form-group">

                    <label for="phoneNumber">
                        Phone Number
                    </label>

                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+968 9123 4567" minlength="8"
                        maxlength="20">

                </div>

                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" minlength="6" maxlength="256"  placeholder="Enter your password" required>

                </div>

                <!-- Region -->
                <div class="form-group">

                    <label for="regionId">
                        Region
                    </label>

                    <select id="regionId" name="regionId">
                        <option value="" selected>Select your region</option>

                        <option>Muscat </option>
                        <option>Dhofar </option>
                        <option>Musandam </option>
                        <option>Al Buraimi </option>
                        <option>Ad Dakhiliyah </option>
                        <option>Al Batinah North </option>
                        <option>Al Batinah South </option>
                        <option>Ash Sharqiyah North </option>
                        <option>Ash Sharqiyah South </option>
                        <option>Adh Dhahirah </option>
                        <option>Al Wusta </option>
                    </select>

                </div>

                <!-- Register Button -->
                <button class="register-button" type="submit">

                    Register

                </button>

            </form>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Sign In -->
            <div class="sign-in">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign In
                </a>

            </div>

        </section>

    </main>

</body>

</html>
