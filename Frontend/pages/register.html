<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OCSP - Create Account</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="/Styles/register.css">
</head>

<body>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Register Card -->
        <section class="register-card">

            <!-- Register Header -->
            <div class="register-header">

                <h1>Create Your Account</h1>

                <p>
                    Join the Oman Community Services Platform
                    to access civic services.
                </p>

            </div>

            <!-- Registration Form -->
            <form action="#" method="post">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input type="text" id="fullName" name="fullName" placeholder="e.g. Ahmed Al Harthi" required>

                </div>

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="ahmed@example.com" required>

                </div>

                <!-- Phone Number -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel" id="phone" name="phone" placeholder="+968 9123 4567" required>

                </div>

                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="••••••••" required>

                </div>

                <!-- Region -->
                <div class="form-group">

                    <label for="region">
                        Region
                    </label>

                    <select id="region" name="region" required>

                        <option value="" disabled selected>
                            Select your region
                        </option>

                        <option value="muscat">
                            Muscat Governorate
                        </option>

                        <option value="dhofar">
                            Dhofar Governorate
                        </option>

                        <option value="musandam">
                            Musandam Governorate
                        </option>

                        <option value="buraimi">
                            Al Buraimi Governorate
                        </option>

                        <option value="dakhiliyah">
                            Al Dakhiliyah Governorate
                        </option>

                        <option value="batinah-north">
                            Al Batinah North Governorate
                        </option>

                        <option value="batinah-south">
                            Al Batinah South Governorate
                        </option>

                        <option value="sharqiyah-north">
                            Al Sharqiyah North Governorate
                        </option>

                        <option value="sharqiyah-south">
                            Al Sharqiyah South Governorate
                        </option>

                        <option value="dhahirah">
                            Al Dhahirah Governorate
                        </option>

                        <option value="wusta">
                            Al Wusta Governorate
                        </option>

                    </select>

                </div>

                <!-- Register Button -->
                <button class="register-button" type="submit">

                    Register

                </button>

            </form>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Sign In -->
            <div class="sign-in">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign In
                </a>

            </div>

        </section>

    </main>

</body>

</html>
