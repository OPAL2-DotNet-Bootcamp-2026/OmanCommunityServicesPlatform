<!--
  Reusable host for JavaScript-rendered citizen issue cards.
  The parent page loads config.js, a data source, data-service.js,
  issue-renderers.js, and its page controller in that order.
-->
<section class="ocsp-issue-component" data-ocsp-issue-component>
  <p class="visually-hidden" data-ocsp-result-summary aria-live="polite"></p>
  <div class="issues-gallery issues-gallery--citizen" data-ocsp-issue-list aria-busy="true"></div>
  <div data-ocsp-issue-detail-host></div>
  <noscript>
    <div class="alert alert-warning">JavaScript is required to load issue data.</div>
  </noscript>
</section>
