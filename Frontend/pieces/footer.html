<!-- ==========================================================================
     OCSP Footer — shared component (static HTML, no JS)

     HOW TO USE:
     Copy the ENTIRE <footer>...</footer> block into every page, right
     before </body>. It has no states — structure, spacing, typography,
     colors, and alignment must stay identical everywhere. If it ever
     needs to change, update it here first, then mirror the change into
     every page's copy. This file is not itself meant to be linked into
     a page — it's a preview and copy source.
     ========================================================================== -->
<footer class="ocsp-footer">
  <div class="container-xxl px-3 px-md-4 py-5">
    <div class="row gy-3 align-items-center">
      <div class="col-12 col-md-8">
        <h2 class="ocsp-footer-title mb-2">Oman Community Services Platform</h2>
        <p class="ocsp-footer-text mb-0">Report and track community issues across Oman.</p>
      </div>
      <div class="col-12 col-md-4 text-md-end">
        <a class="ocsp-footer-link" href="home.html">Home</a>
      </div>
    </div>
    <hr class="ocsp-footer-divider my-4">
    <p class="ocsp-footer-copy mb-0">© 2026 Oman Community Services Platform</p>
  </div>
</footer>

</body>
