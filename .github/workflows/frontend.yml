name: Frontend

# Sixteen JavaScript files are being converted to TypeScript across four
# parallel branches. This gate is what stops a conversion that does not
# compile, or one that reaches for `any`, from reaching main.

on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: Frontend

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Vite warns that the not-yet-converted <script src="...js"> tags in
      # scripts/ cannot be bundled. That is expected during the migration and
      # clears page by page as each member converts theirs.
      - name: Build
        run: npm run build
